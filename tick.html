<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Drag test</title>
<style>
  /* A test of iPhone's own drag and drop for the calendar (his ask, 12 Nov: the tick as a workout lifts). Not linked from the app. */
  :root { color-scheme: light dark; --bg: #f5f5f5; --ink: #1d1d1f; --quiet: #6b6b70; --chip: color-mix(in srgb, #8e8e93 25%, #f5f5f5); --chip-ink: color-mix(in srgb, #8e8e93 50%, #000); --line: rgba(0,0,0,0.09); --on: rgba(0,0,0,0.05); }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --ink: #fff; --quiet: rgba(255,255,255,0.55); --chip: color-mix(in srgb, #8e8e93 25%, #000); --chip-ink: #8e8e93; --line: rgba(255,255,255,0.165); --on: rgba(255,255,255,0.098); } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.4 -apple-system, system-ui, sans-serif; padding: calc(24px + env(safe-area-inset-top)) 16px 40px; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p { margin: 0 0 14px; color: var(--quiet); }
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin: 26px 0 30px; -webkit-user-select: none; user-select: none; }
  .day { min-height: 116px; padding: 8px 2px 6px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .day.on { background: var(--on); }
  .day .wd { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--quiet); }
  .day .dn { font-size: 18px; font-weight: 500; }
  .evs { align-self: stretch; display: flex; flex-direction: column; gap: 3px; padding: 0 2px; }
  .ev { display: block; height: 16px; border-radius: 4px; padding: 0 2px; overflow: hidden; white-space: nowrap; font-size: 11px; line-height: 16px; font-weight: 600; background: var(--chip); color: var(--chip-ink);
    -webkit-user-select: none; user-select: none; -webkit-user-drag: element; -webkit-touch-callout: default; }   /* iPhone's own drag needs the long press left to it */
  #big { position: fixed; left: -400px; top: 0; width: 85px; height: 20px; border-radius: 5px; padding: 0 6px; overflow: hidden; white-space: nowrap; font-size: 15px; line-height: 20px; font-weight: 600; color: #fff; background: #8e8e93; }
  .note { font-size: 15px; color: var(--quiet); }
  #log { font: 13px/1.4 ui-monospace, Menlo, monospace; color: var(--quiet); white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Drag test</h1>
<p>Hold a grey name until it lifts, then drag it to another day. Do you feel a tick as it lifts?</p>
<p class="note">A lifts as iPhone draws it. B asks iPhone to lift our bigger name instead.</p>
<div class="week" id="week"></div>
<div id="big" aria-hidden="true">Push day</div>
<div id="log"></div>
<script>
  const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], week = document.getElementById("week"), big = document.getElementById("big"), log = document.getElementById("log");
  const say = (s) => { log.textContent = s + "\n" + log.textContent.split("\n").slice(0, 5).join("\n"); };
  days.forEach((d, i) => {
    const b = document.createElement("div"); b.className = "day"; b.dataset.i = i;
    b.innerHTML = '<span class="wd">' + d + '</span><span class="dn">' + (9 + i) + '</span><span class="evs"></span>';
    week.appendChild(b);
  });
  const chip = (id, words, day) => { const c = document.createElement("span"); c.className = "ev"; c.id = id; c.draggable = true; c.textContent = words; week.children[day].querySelector(".evs").appendChild(c); return c; };
  chip("A", "A: Push day", 2); chip("B", "B: Push day", 4);
  let dragging = null;
  week.addEventListener("dragstart", (e) => {
    const c = e.target.closest && e.target.closest(".ev"); if (!c) return; dragging = c;
    try { e.dataTransfer.setData("text/plain", c.id); e.dataTransfer.effectAllowed = "move"; if (c.id === "B") e.dataTransfer.setDragImage(big, 42, 38); } catch (err) { say("drag image: " + err); }
    say("lifted " + c.id);
  });
  const dayAt = (e) => e.target.closest && e.target.closest(".day");
  document.addEventListener("dragover", (e) => { e.preventDefault(); try { e.dataTransfer.dropEffect = "move"; } catch (_) {} const d = dayAt(e); for (const x of week.children) x.classList.toggle("on", x === d); });
  document.addEventListener("drop", (e) => { e.preventDefault(); const d = dayAt(e); if (d && dragging) { d.querySelector(".evs").appendChild(dragging); say("dropped " + dragging.id + " on " + days[d.dataset.i]); } for (const x of week.children) x.classList.remove("on"); });
  document.addEventListener("dragend", () => { for (const x of week.children) x.classList.remove("on"); dragging = null; });
</script>
</body>
</html>
