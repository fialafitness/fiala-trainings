<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fiala">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161617" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Fiala Trainings</title>
<style>
  [hidden] { display: none !important; }
  img { max-width: 100%; }
  html { background: var(--canvas); }
  body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  :root {
    --ink: #1d1d1f;
    --ink-2: #6e6e73;
    --ink-3: #86868b;
    --hair: #d2d2d7;
    --canvas: #f5f5f7;
    --surface: #ffffff;
    --field: #f5f5f7;
    --accent: #6f6b99;
    --done: #7f9a3f;
    --danger: #c84653;
    --ghost: #b0b0b5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ink: #f5f5f7;
      --ink-2: #a1a1a6;
      --ink-3: #86868b;
      --hair: #3a3a3c;
      --canvas: #161617;
      --surface: #1d1d1f;
      --field: #2c2c2e;
      --accent: #9e9bc2;
      --done: #a9b96b;
      --danger: #e0707a;
      --ghost: #5c5c60;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ink: #f5f5f7;
    --ink-2: #a1a1a6;
    --ink-3: #86868b;
    --hair: #3a3a3c;
    --canvas: #161617;
    --surface: #1d1d1f;
    --field: #2c2c2e;
    --accent: #9e9bc2;
    --done: #a9b96b;
    --danger: #e0707a;
    --ghost: #5c5c60;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, -apple-system, "SF Pro Text", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .tab { font-variant-numeric: tabular-nums; }

  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: color-mix(in srgb, var(--canvas) 88%, transparent);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--hair);
  }
  .bar {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 16px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .back {
    appearance: none; border: 0; background: none; padding: 0;
    color: var(--accent); font: inherit; font-size: 17px; cursor: pointer;
    min-height: 44px; display: inline-flex; align-items: center; gap: 4px;
    max-width: 70%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .brand { font-weight: 600; letter-spacing: 0.02em; }
  .brand b { color: var(--accent); font-weight: 600; }
  #status { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
  #status.err { color: var(--danger); cursor: pointer; }

  main { max-width: 680px; margin: 0 auto; padding: 8px 16px 96px; }
  h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin: 16px 0 12px; text-wrap: balance; }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin: 28px 0 8px; }
  .muted { color: var(--ink-3); font-size: 15px; }
  .notice { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; padding: 10px 14px; font-size: 14px; color: var(--ink-2); margin: 12px 0 0; }

  input, textarea, button, select { font: inherit; color: inherit; }
  input, textarea {
    width: 100%; min-width: 0;
    background: var(--field); border: 1px solid transparent; border-radius: 10px;
    padding: 10px 12px; font-size: 16px; outline: none;
  }
  input::placeholder, textarea::placeholder { color: var(--ghost); }
  input:focus, textarea:focus { border-color: var(--accent); background: var(--surface); }
  textarea { resize: vertical; min-height: 72px; line-height: 1.4; }
  input[type="date"] { -webkit-appearance: none; appearance: none; }

  .btn {
    appearance: none; border: 0; cursor: pointer; border-radius: 12px;
    min-height: 44px; padding: 0 18px; font-size: 16px; font-weight: 500;
    background: var(--ink); color: var(--canvas);
  }
  .btn:active { opacity: 0.8; }
  .btn.quiet { background: transparent; color: var(--accent); padding: 0 6px; font-weight: 500; }
  .btn.danger { background: transparent; color: var(--danger); padding: 0 6px; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn:focus-visible, .back:focus-visible, .list button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .addrow { display: flex; gap: 8px; margin-top: 8px; }
  .addrow input { flex: 1; }

  .list { background: var(--surface); border-radius: 14px; overflow: hidden; margin: 0; padding: 0; list-style: none; }
  .list li + li { border-top: 1px solid var(--hair); }
  .list button {
    appearance: none; border: 0; background: none; width: 100%; text-align: left; cursor: pointer;
    min-height: 56px; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-size: 17px; color: var(--ink);
  }
  .list button:active { background: var(--canvas); }
  .list .sub { color: var(--ink-3); font-size: 14px; white-space: nowrap; }
  .list .chev { color: var(--ink-3); margin-left: 6px; }
  .empty { color: var(--ink-3); font-size: 15px; padding: 18px 0 4px; }

  /* Training */
  .ttl { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin-top: 14px; }
  .ttl input.title { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; background: transparent; padding-left: 0; }
  .ttl input.title:focus { background: var(--surface); padding-left: 12px; }
  .ttl input[type="date"] { width: auto; font-size: 15px; color: var(--ink-2); padding: 8px 10px; }
  .actions { display: flex; gap: 6px; margin: 6px 0 0; flex-wrap: wrap; }

  .rows { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .row { background: var(--surface); border-radius: 14px; padding: 12px 12px 12px; }
  .row .top { display: grid; grid-template-columns: 58px 1fr 36px; gap: 8px; align-items: center; }
  .row .top input.label { text-align: center; font-weight: 600; padding-left: 6px; padding-right: 6px; }
  .row .top .exwrap { position: relative; }
  .row .top input.name { font-weight: 500; }
  .row .x {
    appearance: none; border: 0; background: none; color: var(--ink-3); cursor: pointer;
    width: 36px; height: 44px; font-size: 20px; line-height: 1; border-radius: 10px;
  }
  .row .x:hover { color: var(--danger); }
  .sugg {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 4;
    background: var(--surface); border: 1px solid var(--hair); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12); overflow: hidden; padding: 4px 0; margin: 0; list-style: none;
  }
  .sugg button {
    appearance: none; border: 0; background: none; width: 100%; text-align: left; cursor: pointer;
    padding: 10px 12px; font-size: 15px; color: var(--ink);
  }
  .sugg button:hover, .sugg button:focus { background: var(--canvas); outline: none; }
  .specs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
  .specs label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 4px 2px; }
  .specs input { padding: 9px 8px; text-align: center; }
  .weights { margin-top: 10px; }
  .weights .cap { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 4px 2px; display: flex; justify-content: space-between; }
  .weights .cap span:last-child { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--ghost); }
  .weights .boxes { display: flex; gap: 6px; flex-wrap: wrap; }
  .weights input { width: 62px; text-align: center; padding: 9px 6px; font-weight: 500; }
  .weights input:not(:placeholder-shown) { border-color: var(--hair); }

  .add { margin-top: 12px; }
  .foot { margin-top: 36px; border-top: 1px solid var(--hair); padding-top: 8px; display: flex; gap: 8px; align-items: center; }
  .confirm { color: var(--ink-2); font-size: 15px; }

  @media (max-width: 400px) {
    .specs { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
    .specs input { padding-left: 4px; padding-right: 4px; font-size: 15px; }
    .row .top { grid-template-columns: 52px 1fr 32px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .list button, .btn, .x { transition: background-color 0.12s, opacity 0.12s, color 0.12s; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <button class="back" id="back" hidden><span>&#8249;</span><span id="backLabel"></span></button>
    <div class="brand" id="brand">FIALA<b>.</b></div>
    <div id="status"></div>
  </div>
</header>

<main>
  <section id="vClients">
    <h1>Clients</h1>
    <form class="addrow" id="clientForm">
      <input id="clientName" placeholder="New client" autocomplete="off" autocapitalize="words">
      <button class="btn" type="submit">Add</button>
    </form>
    <div class="foot" id="localFoot" hidden><span class="muted">Saved on this device</span><button class="btn quiet" id="backup" type="button">Back up</button><button class="btn quiet" id="restore" type="button">Restore</button><input type="file" id="restoreFile" accept="application/json,.json" hidden></div>
    <ul class="list" id="clientList" style="margin-top:14px"></ul>
    <div class="empty" id="clientEmpty" hidden>No clients yet. Add the first one above.</div>
  </section>

  <section id="vClient" hidden>
    <input id="cName" class="tab" style="font-size:26px;font-weight:600;letter-spacing:-0.02em;background:transparent;padding-left:0;margin-top:12px" placeholder="Client name" autocapitalize="words">
    <h2>Trainings</h2>
    <button class="btn" id="newTraining" style="width:100%">+ New training</button>
    <ul class="list" id="trainingList" style="margin-top:10px"></ul>
    <div class="empty" id="trainingEmpty" hidden>No trainings yet.</div>
    <h2>Notes</h2>
    <textarea id="cNotes" placeholder="Injuries, preferences, anything to remember"></textarea>
    <div class="foot">
      <button class="btn danger" id="delClient">Delete client</button>
      <span class="confirm" id="delClientConfirm" hidden>Deletes all their trainings too. <button class="btn danger" id="delClientYes">Delete</button> <button class="btn quiet" id="delClientNo">Keep</button></span>
    </div>
  </section>

  <section id="vTraining" hidden>
    <div class="ttl">
      <input id="tTitle" class="title" placeholder="Training title" autocapitalize="sentences">
      <input id="tDate" type="date">
    </div>
    <div class="rows" id="rows"></div>
    <button class="btn quiet add" id="addRow">+ Add exercise</button>
    <div class="foot">
      <button class="btn quiet" id="copyTraining">Copy training</button>
      <button class="btn danger" id="delTraining">Delete training</button>
      <span class="confirm" id="delTrainingConfirm" hidden><button class="btn danger" id="delTrainingYes">Delete</button> <button class="btn quiet" id="delTrainingNo">Keep</button></span>
    </div>
  </section>
</main>

  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10));
  const now = () => new Date().toISOString();
  const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const fmtDate = (s) => { if (!s) return ""; const [y, m, d] = s.split("-").map(Number); const dt = new Date(y, m - 1, d); const opts = { month: "short", day: "numeric" }; if (y !== new Date().getFullYear()) opts.year = "numeric"; return dt.toLocaleDateString(undefined, opts); };
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const labelKey = (l) => { const m = String(l || "").trim().match(/^(\d+)\s*([a-z]*)/i); return m ? [parseInt(m[1], 10), m[2].toLowerCase()] : [Infinity, String(l || "").toLowerCase()]; };
  const cmpLabel = (a, b) => { const [an, as] = labelKey(a), [bn, bs] = labelKey(b); return an - bn || (as < bs ? -1 : as > bs ? 1 : 0); };
  const norm = (s) => String(s || "").trim().toLowerCase();
  const lsGet = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  // ---------- state ----------
  const clients = new Map();   // id -> {id,name,notes,createdAt}
  const trainings = new Map(); // id -> {id,clientId,title,date,createdAt,rows:[...]}
  let view = { name: "clients" };
  let backend = null;          // { set(kind,id,data), del(kind,id) }
  const dirty = new Map();     // key -> local version counter (unconfirmed edits)
  const timers = new Map();
  const chains = new Map();
  let inflight = 0, failed = false;

  // ---------- persistence ----------
  function key(kind, id) { return kind + "/" + id; }
  function markDirty(kind, id) { const k = key(kind, id); dirty.set(k, (dirty.get(k) || 0) + 1); }

  function scheduleSave(kind, id, delay = 500) {
    markDirty(kind, id);
    const k = key(kind, id);
    clearTimeout(timers.get(k));
    timers.set(k, setTimeout(() => flushOne(kind, id), delay));
    setStatus();
  }

  function flushAll() { for (const k of [...timers.keys()]) { const [kind, id] = k.split("/"); clearTimeout(timers.get(k)); flushOne(kind, id); } }

  function flushOne(kind, id) {
    const k = key(kind, id);
    timers.delete(k);
    const map = kind === "clients" ? clients : trainings;
    const doc = map.get(id);
    const version = dirty.get(k) || 0;
    const data = doc ? JSON.parse(JSON.stringify(doc)) : null;
    const prev = chains.get(k) || Promise.resolve();
    inflight++; setStatus();
    const run = prev.then(async () => {
      if (!backend) return;
      let attempt = 0;
      for (;;) {
        try {
          if (data) await backend.set(kind, id, data); else await backend.del(kind, id);
          failed = false;
          if (dirty.get(k) === version) dirty.delete(k);
          return;
        } catch (e) {
          attempt++;
          if (attempt > 3) { failed = true; return; }
          await new Promise((r) => setTimeout(r, 700 * attempt + Math.random() * 400));
        }
      }
    }).finally(() => { inflight--; setStatus(); });
    chains.set(k, run.catch(() => {}));
    return run;
  }

  function setStatus() {
    const el = $("status");
    const pending = timers.size + inflight;
    if (failed && pending === 0 && dirty.size > 0) { el.textContent = "Couldn't save \u00b7 tap to retry"; el.className = "err"; return; }
    el.className = "";
    el.textContent = pending > 0 ? "Saving\u2026" : (backend ? "Saved" : "");
  }
  $("status").addEventListener("click", () => { if (failed) { failed = false; for (const k of dirty.keys()) { const [kind, id] = k.split("/"); flushOne(kind, id); } } });

  const localBackend = {
    load() { const d = lsGet("fiala.trainings.v1") || { clients: {}, trainings: {} }; for (const c of Object.values(d.clients)) clients.set(c.id, c); for (const t of Object.values(d.trainings)) trainings.set(t.id, t); },
    save() { lsSet("fiala.trainings.v1", { clients: Object.fromEntries(clients), trainings: Object.fromEntries(trainings) }); },
    async set() { this.save(); },
    async del() { this.save(); },
  };

  function dbBackend(db) {
    return {
      async set(kind, id, data) { await db.collection(kind).doc(id).set(data); },
      async del(kind, id) { await db.collection(kind).doc(id).delete(); },
      subscribe() {
        db.collection("clients").onSnapshot((snap) => { applySnapshot(clients, "clients", snap); render(); }, (e) => console.warn("clients", e));
        db.collection("trainings").onSnapshot((snap) => { applySnapshot(trainings, "trainings", snap); render(); }, (e) => console.warn("trainings", e));
      },
    };
  }

  function applySnapshot(map, kind, snap) {
    const seen = new Set();
    for (const d of snap.docs) {
      seen.add(d.id);
      if (dirty.has(key(kind, d.id))) continue; // local edits win until confirmed
      map.set(d.id, { ...d.data(), id: d.id });
    }
    for (const id of [...map.keys()]) if (!seen.has(id) && !dirty.has(key(kind, id))) map.delete(id);
  }

  // ---------- data ops ----------
  function addClient(name) {
    const c = { id: uid(), name, notes: "", createdAt: now() };
    clients.set(c.id, c); scheduleSave("clients", c.id, 0);
    go({ name: "client", id: c.id });
  }
  function clientTrainings(clientId) {
    return [...trainings.values()].filter((t) => t.clientId === clientId)
      .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || "").localeCompare(a.createdAt || ""));
  }
  function newRow(label) { return { id: uid(), label, name: "", sets: 3, reps: "", tempo: "", scheme: "", rest: "", weights: [] }; }
  function nextLabel(t) { let max = 0; for (const r of t.rows) { const n = labelKey(r.label)[0]; if (Number.isFinite(n)) max = Math.max(max, n); } return String(max + 1); }
  function addTraining(clientId, from) {
    const list = clientTrainings(clientId);
    const t = {
      id: uid(), clientId, date: today(), createdAt: now(),
      title: from ? from.title : "Training " + (list.length + 1),
      rows: from ? from.rows.map((r) => ({ ...r, id: uid(), weights: [] })) : [],
    };
    trainings.set(t.id, t); scheduleSave("trainings", t.id, 0);
    go({ name: "training", id: t.id });
  }
  function deleteTraining(id) {
    const t = trainings.get(id); if (!t) return;
    trainings.delete(id); scheduleSave("trainings", id, 0);
    go({ name: "client", id: t.clientId });
  }
  function deleteClient(id) {
    for (const t of clientTrainings(id)) { trainings.delete(t.id); scheduleSave("trainings", t.id, 0); }
    clients.delete(id); scheduleSave("clients", id, 0);
    go({ name: "clients" });
  }
  // Weights from the most recent earlier training of this client with the same exercise.
  function lastWeights(t, row) {
    const name = norm(row.name); if (!name) return null;
    for (const other of clientTrainings(t.clientId)) {
      if (other.id === t.id) continue;
      if ((other.date || "") > (t.date || "")) continue;
      if (other.date === t.date && (other.createdAt || "") >= (t.createdAt || "")) continue;
      const r = other.rows.find((x) => norm(x.name) === name && (x.weights || []).some((w) => String(w || "").trim() !== ""));
      if (r) return { date: other.date, weights: r.weights };
    }
    return null;
  }

  // ---------- navigation ----------
  function go(next) { view = next; lsSet("fiala.trainings.view", view); render(); window.scrollTo(0, 0); }
  $("back").addEventListener("click", () => {
    if (view.name === "training") { const t = trainings.get(view.id); go(t ? { name: "client", id: t.clientId } : { name: "clients" }); }
    else go({ name: "clients" });

  // ---------- render ----------
  let renderedTraining = null;
  function render() {
    if (view.name === "client" && !clients.has(view.id)) view = { name: "clients" };
    if (view.name === "training" && !trainings.has(view.id)) view = { name: "clients" };
    $("vClients").hidden = view.name !== "clients";
    $("vClient").hidden = view.name !== "client";
    $("vTraining").hidden = view.name !== "training";
    $("back").hidden = view.name === "clients";
    $("brand").hidden = view.name !== "clients";
    if (view.name === "clients") { renderedTraining = null; renderClients(); }
    else if (view.name === "client") { renderedTraining = null; $("backLabel").textContent = "Clients"; renderClient(); }
    else { const t = trainings.get(view.id); $("backLabel").textContent = clients.get(t.clientId)?.name || "Client"; renderTraining(t); }
  }

  function renderClients() {
    const list = [...clients.values()].sort((a, b) => a.name.localeCompare(b.name));
    const ul = $("clientList"); ul.replaceChildren();
    for (const c of list) {
      const li = document.createElement("li"); const b = document.createElement("button"); b.type = "button";
      const n = clientTrainings(c.id).length;
      b.innerHTML = `<span></span><span class="sub"></span>`;
      b.firstChild.textContent = c.name; b.lastChild.textContent = (n ? n + (n === 1 ? " training" : " trainings") : "") ; b.lastChild.insertAdjacentHTML("beforeend", '<span class="chev">&rsaquo;</span>');
      b.addEventListener("click", () => go({ name: "client", id: c.id }));
      li.appendChild(b); ul.appendChild(li);
    }
    $("clientEmpty").hidden = list.length > 0;
  }

  function renderClient() {
    const c = clients.get(view.id);
    if (document.activeElement !== $("cName")) $("cName").value = c.name;
    if (document.activeElement !== $("cNotes")) $("cNotes").value = c.notes || "";
    const list = clientTrainings(c.id);
    const ul = $("trainingList"); ul.replaceChildren();
    for (const t of list) {
      const li = document.createElement("li"); const b = document.createElement("button"); b.type = "button";
      const filled = t.rows.some((r) => (r.weights || []).some((w) => String(w || "").trim() !== ""));
      b.innerHTML = `<span></span><span class="sub tab"></span>`;
      b.firstChild.textContent = t.title || "Untitled";
      b.lastChild.textContent = (filled ? "\u2713 " : "") + fmtDate(t.date); b.lastChild.insertAdjacentHTML("beforeend", '<span class="chev">&rsaquo;</span>');
      b.addEventListener("click", () => go({ name: "training", id: t.id }));
      li.appendChild(b); ul.appendChild(li);
    }
    $("trainingEmpty").hidden = list.length > 0;
    $("delClientConfirm").hidden = true; $("delClient").hidden = false;
  }

  function renderTraining(t) {
    if (document.activeElement !== $("tTitle")) $("tTitle").value = t.title || "";
    if (document.activeElement !== $("tDate")) $("tDate").value = t.date || "";
    const rowsEl = $("rows");
    const active = document.activeElement;
    if (renderedTraining === t.id && rowsEl.contains(active) && active.tagName === "INPUT") return; // never rebuild under a typing finger
    renderedTraining = t.id;
    t.rows.sort((a, b) => cmpLabel(a.label, b.label));
    rowsEl.replaceChildren(...t.rows.map((r) => rowEl(t, r)));
    $("delTrainingConfirm").hidden = true; $("delTraining").hidden = false;
  }

  function rowEl(t, r) {
    const el = document.createElement("div"); el.className = "row"; el.dataset.id = r.id;
    el.innerHTML = `
      <div class="top">
        <input class="label tab" placeholder="#" autocomplete="off" autocapitalize="none" aria-label="Number">
        <div class="exwrap"><input class="name" placeholder="Exercise" autocomplete="off" autocapitalize="sentences" aria-label="Exercise"><ul class="sugg" hidden></ul></div>
        <button class="x" type="button" aria-label="Remove exercise">\u00d7</button>
      </div>
      <div class="specs">
        <div><label>Sets</label><input class="sets tab" inputmode="numeric" pattern="[0-9]*" placeholder="3"></div>
        <div><label>Reps</label><input class="reps tab" placeholder="10"></div>
        <div><label>Tempo</label><input class="tempo tab" placeholder="1010" autocapitalize="characters"></div>
        <div><label>Scheme</label><input class="scheme" placeholder="Add"></div>
        <div><label>Rest</label><input class="rest tab" placeholder="60 s"></div>
      </div>
      <div class="weights"><div class="cap"><span>Weights</span><span class="last"></span></div><div class="boxes"></div></div>`;
    const q = (s) => el.querySelector(s);
    q(".label").value = r.label || ""; q(".name").value = r.name || "";
    q(".sets").value = r.sets || ""; q(".reps").value = r.reps || ""; q(".tempo").value = r.tempo || "";
    q(".scheme").value = r.scheme || ""; q(".rest").value = r.rest || "";

    const save = () => scheduleSave("trainings", t.id);
    const bind = (sel, field, transform) => q(sel).addEventListener("input", (e) => { r[field] = transform ? transform(e.target.value) : e.target.value; save(); });
    bind(".label", "label"); bind(".reps", "reps"); bind(".tempo", "tempo"); bind(".scheme", "scheme"); bind(".rest", "rest");
    q(".label").addEventListener("blur", () => { const sorted = [...t.rows].sort((a, b) => cmpLabel(a.label, b.label)); if (sorted.some((x, i) => x !== t.rows[i])) { renderedTraining = null; render(); } });
    q(".sets").addEventListener("input", (e) => { const v = e.target.value.replace(/\D/g, "").slice(0, 2); e.target.value = v; r.sets = v === "" ? 0 : clamp(parseInt(v, 10), 0, 20); renderWeights(); save(); });
    q(".name").addEventListener("input", (e) => { r.name = e.target.value; save(); suggest(e.target.value); renderWeights(); });
    q(".name").addEventListener("blur", () => setTimeout(() => { q(".sugg").hidden = true; }, 120));
    q(".name").addEventListener("focus", (e) => suggest(e.target.value));
    q(".x").addEventListener("click", () => { t.rows = t.rows.filter((x) => x.id !== r.id); el.remove(); save(); });

    function suggest(v) {
      const ul = q(".sugg"); const s = norm(v);
      if (s.length < 2) { ul.hidden = true; return; }
      const starts = [], contains = [];
      for (const n of NAMES) { const ln = n.toLowerCase(); if (ln === s) continue; if (ln.startsWith(s)) starts.push(n); else if (ln.includes(s)) contains.push(n); if (starts.length >= 6) break; }
      const hits = [...starts, ...contains].slice(0, 6);
      ul.replaceChildren(...hits.map((n) => { const li = document.createElement("li"); const b = document.createElement("button"); b.type = "button"; b.textContent = n; b.addEventListener("mousedown", (ev) => ev.preventDefault()); b.addEventListener("click", () => { r.name = n; q(".name").value = n; ul.hidden = true; save(); renderWeights(); }); li.appendChild(b); return li; }));
      ul.hidden = hits.length === 0;
    }

    function renderWeights() {
      const n = clamp(parseInt(r.sets, 10) || 0, 0, 20);
      const boxes = q(".boxes"); const last = lastWeights(t, r);
      q(".last").textContent = last ? "last time in grey \u00b7 " + fmtDate(last.date) : "";
      r.weights = (r.weights || []).slice(0, n); while (r.weights.length < n) r.weights.push("");
      boxes.replaceChildren(...Array.from({ length: n }, (_, i) => {
        const inp = document.createElement("input"); inp.className = "tab"; inp.inputMode = "decimal"; inp.setAttribute("aria-label", "Set " + (i + 1) + " weight");
        inp.value = r.weights[i] || ""; inp.placeholder = (last && last.weights[i]) ? last.weights[i] : "\u2013";
        inp.addEventListener("input", (e) => { r.weights[i] = e.target.value; save(); });
        inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); const nx = boxes.children[i + 1]; if (nx) nx.focus(); else inp.blur(); } });
        return inp;
      }));
      el.querySelector(".weights").hidden = n === 0;
    }
    renderWeights();
    return el;
  }

  // ---------- events ----------
  $("clientForm").addEventListener("submit", (e) => { e.preventDefault(); const n = $("clientName").value.trim(); if (!n) return; $("clientName").value = ""; addClient(n); });
  $("cName").addEventListener("input", (e) => { const c = clients.get(view.id); if (!c) return; c.name = e.target.value; scheduleSave("clients", c.id); });
  $("cNotes").addEventListener("input", (e) => { const c = clients.get(view.id); if (!c) return; c.notes = e.target.value; scheduleSave("clients", c.id); });
  $("newTraining").addEventListener("click", () => addTraining(view.id));
  $("delClient").addEventListener("click", () => { $("delClient").hidden = true; $("delClientConfirm").hidden = false; });
  $("delClientNo").addEventListener("click", () => { $("delClientConfirm").hidden = true; $("delClient").hidden = false; });
  $("delClientYes").addEventListener("click", () => deleteClient(view.id));

  $("tTitle").addEventListener("input", (e) => { const t = trainings.get(view.id); if (!t) return; t.title = e.target.value; scheduleSave("trainings", t.id); });
  $("tDate").addEventListener("change", (e) => { const t = trainings.get(view.id); if (!t) return; t.date = e.target.value || today(); scheduleSave("trainings", t.id); renderedTraining = null; render(); });
  $("addRow").addEventListener("click", () => {
    const t = trainings.get(view.id); if (!t) return;
    const r = newRow(nextLabel(t)); t.rows.push(r); scheduleSave("trainings", t.id);
    const el = rowEl(t, r); $("rows").appendChild(el); el.querySelector(".name").focus();
  });
  $("copyTraining").addEventListener("click", () => { const t = trainings.get(view.id); if (t) addTraining(t.clientId, t); });
  $("delTraining").addEventListener("click", () => { $("delTraining").hidden = true; $("delTrainingConfirm").hidden = false; });
  $("delTrainingNo").addEventListener("click", () => { $("delTrainingConfirm").hidden = true; $("delTraining").hidden = false; });
  $("delTrainingYes").addEventListener("click", () => deleteTraining(view.id));

  window.addEventListener("pagehide", flushAll);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushAll(); });

  $("backup").addEventListener("click", () => {
    const data = { app: "fiala-trainings", exported: now(), clients: Object.fromEntries(clients), trainings: Object.fromEntries(trainings) };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "fiala-trainings-" + today() + ".json";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  $("restore").addEventListener("click", () => $("restoreFile").click());
  $("restoreFile").addEventListener("change", async (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!d || d.app !== "fiala-trainings") throw new Error("not a backup");
      for (const c of Object.values(d.clients || {})) { clients.set(c.id, c); scheduleSave("clients", c.id, 0); }
      for (const t of Object.values(d.trainings || {})) { trainings.set(t.id, t); scheduleSave("trainings", t.id, 0); }
      render();
    } catch { $("status").textContent = "That file is not a Fiala backup"; }
    e.target.value = "";
  });

  // ---------- boot ----------
  async function boot() {
    const saved = lsGet("fiala.trainings.view"); if (saved && saved.name) view = saved;
    $("status").textContent = "Loading\u2026";
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch { db = null; }
    if (db) { backend = dbBackend(db); backend.subscribe(); }
    else { backend = localBackend; localBackend.load(); $("localFoot").hidden = false; render(); }
    setStatus();
  }
  render();
  boot();
})();
</script>

</body>
</html>
