<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fiala">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161617" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<title>Fiala Trainings</title>
<style>
  /* Fiala Fitness Brand Bible v4.2 — App Surface tokens */
  [hidden] { display: none !important; }
  img { max-width: 100%; }
  :root {
    --text-primary: #1d1d1f;            /* Shark */
    --text-secondary: #6e6e73;          /* Steel */
    --text-tertiary: #86868b;           /* Medium Gray */
    --text-quaternary: #d2d2d7;         /* Silver — decorative only */
    --surface: #ffffff;                 /* surface-primary */
    --surface-2: #f5f5f7;               /* surface-secondary — forms */
    --card: #ffffff;
    --card-border: rgba(0,0,0,0.06);    /* border-on-light-standard */
    --header: rgba(255,255,255,0.85);   /* surface-primary-a85 */
    --header-border: rgba(0,0,0,0.04);  /* border-on-light-subtle */
    --field: #f5f5f7;
    --placeholder: #d2d2d7;
    --brand: #6f6b99;                   /* app-purple — structure / interactive, EXACT */
    --brand-deep: #494664;              /* app-purple-deep — reserved for brand moments */
    --group-1: #5e8ca7;                 /* Steel blue */
    --group-2: #a2845e;                 /* Sand — Apple system brown, light */
    --done: #5a742c;                    /* Olive deep — success text on light */
    --done-fill: #a9b96b;               /* Olive — fills and badges on light */
    --done-ink: #ffffff;
    --danger: #a63a46;                  /* Crimson deep — red text on light */
    --btn-bg: #1d1d1f;                  /* Secondary tier: dark button on light */
    --btn-fg: #ffffff;
    --logo-light: inline-block;
    --logo-dark: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --text-primary: rgba(255,255,255,1);
      --text-secondary: rgba(255,255,255,0.75);
      --text-tertiary: rgba(255,255,255,0.55);
      --text-quaternary: rgba(255,255,255,0.35);
      --surface: #161617;               /* surface-black — night mode */
      --surface-2: #1d1d1f;
      --card: rgba(255,255,255,0.04);   /* overlay-glass-light */
      --card-border: rgba(255,255,255,0.10);
      --header: rgba(22,22,23,0.85);
      --header-border: rgba(255,255,255,0.06);
      --field: rgba(255,255,255,0.06);
      --placeholder: rgba(255,255,255,0.35);
      --brand: #6f6b99;
      --brand-deep: #494664;
      --group-1: #5e8ca7;
      --group-2: #ac8e68;               /* Sand — Apple system brown, dark */
      --done: #e9f5a0;                  /* Olive glow */
      --done-fill: #e9f5a0;
      --done-ink: #1d1d1f;
      --danger: #c84653;                /* Crimson */
      --btn-bg: #ffffff;                /* Primary tier: white button on dark */
      --btn-fg: #1d1d1f;
      --logo-light: none;
      --logo-dark: inline-block;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --text-primary: rgba(255,255,255,1);
    --text-secondary: rgba(255,255,255,0.75);
    --text-tertiary: rgba(255,255,255,0.55);
    --text-quaternary: rgba(255,255,255,0.35);
    --surface: #161617;
    --surface-2: #1d1d1f;
    --card: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.10);
    --header: rgba(22,22,23,0.85);
    --header-border: rgba(255,255,255,0.06);
    --field: rgba(255,255,255,0.06);
    --placeholder: rgba(255,255,255,0.35);
    --brand: #6f6b99;
    --brand-deep: #494664;
    --group-1: #5e8ca7;
    --group-2: #ac8e68;               /* Sand — Apple system brown, dark */
    --done: #e9f5a0;
    --done-fill: #e9f5a0;
    --done-ink: #1d1d1f;
    --danger: #c84653;
    --btn-bg: #ffffff;
    --btn-fg: #1d1d1f;
    --logo-light: none;
    --logo-dark: inline-block;
  }

  * { box-sizing: border-box; }
  html { background: var(--surface); }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--surface);
    color: var(--text-primary);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.55;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .tab { font-variant-numeric: tabular-nums; }

  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--header);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--header-border);
  }
  .bar { max-width: 680px; margin: 0 auto; padding: 0 16px; height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .back {
    appearance: none; border: 0; background: none; padding: 0;
    color: var(--brand); font: inherit; font-size: 17px; letter-spacing: -0.01em; cursor: pointer;
    min-height: 44px; display: inline-flex; align-items: center; gap: 4px;
    max-width: 70%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    transition: opacity 300ms ease;
  }
  .back:hover { opacity: 0.7; }
  .brand { display: flex; align-items: center; height: 32px; }
  .brand img { height: 32px; width: auto; display: block; }
  .brand .logo-light { display: var(--logo-light); }
  .brand .logo-dark { display: var(--logo-dark); }
  #status { font-size: 13px; letter-spacing: 0; color: var(--text-tertiary); white-space: nowrap; }
  #status.err { color: var(--danger); cursor: pointer; }

  main { max-width: 680px; margin: 0 auto; padding: 8px 16px 80px; }
  h1, .pagetitle { font-size: 26px; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; margin: 20px 0 16px; text-wrap: balance; }
  h2 { font-size: 13px; font-weight: 500; line-height: 1; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text-tertiary); margin: 32px 0 12px; }
  .muted { color: var(--text-tertiary); font-size: 13px; letter-spacing: 0; }
  .notice { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 16px; font-size: 13px; color: var(--text-secondary); margin: 12px 0 0; }

  input, textarea, button, select { font: inherit; color: inherit; letter-spacing: inherit; }
  input, textarea {
    width: 100%; min-width: 0;
    background: var(--field); border: 1px solid transparent; border-radius: 12px;
    padding: 12px 16px; font-size: 16px; line-height: 1.3; outline: none;
    transition: border-color 150ms ease, background-color 150ms ease;
  }
  input::placeholder, textarea::placeholder { color: var(--placeholder); opacity: 1; }
  input.hint::placeholder { color: var(--text-secondary); }
  input:focus, textarea:focus { border-color: var(--brand); background: var(--surface); }
  textarea { resize: vertical; min-height: 96px; line-height: 1.55; }
  input[type="date"] { -webkit-appearance: none; appearance: none; }
  .pagetitle { width: 100%; background: transparent; padding: 0; border-radius: 12px; }
  .pagetitle:focus { background: var(--field); padding: 8px 12px; }

  .btn {
    appearance: none; border: 0; cursor: pointer; border-radius: 50px;
    min-height: 44px; padding: 12px 32px; font-size: 17px; font-weight: 400; letter-spacing: 0.01em;
    background: var(--btn-bg); color: var(--btn-fg);
    transition: opacity 300ms ease;
  }
  .btn.sm { min-height: 40px; padding: 10px 24px; font-size: 14px; }
  .btn:hover, .btn:active { opacity: 0.85; }
  .btn.quiet { background: transparent; color: var(--text-secondary); padding: 0 8px; }
  .btn.danger { background: transparent; color: var(--danger); padding: 0 8px; }
  .btn.quiet:hover, .btn.danger:hover { opacity: 0.7; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn:focus-visible, .back:focus-visible, .list button:focus-visible, .x:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  .stack { display: flex; flex-direction: column; gap: 12px; max-width: 360px; }
  body.client .trainer-only { display: none !important; }
  body.client .row .x, body.client .row .note { display: none; }
  body.client input[readonly] { background: transparent; padding-left: 0; padding-right: 0; }
  body.client .row .top input.label[readonly] { padding: 0; text-align: center; }
  body.client .specs input[readonly] { padding-left: 0; padding-right: 0; }
  .addrow { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .addrow input { flex: 1; }

  .list { background: var(--card); border: 1px solid var(--card-border); border-radius: 20px; overflow: hidden; margin: 0; padding: 0; list-style: none; }
  .list li + li { border-top: 1px solid var(--card-border); }
  .list button {
    appearance: none; border: 0; background: none; width: 100%; text-align: left; cursor: pointer;
    min-height: 56px; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-size: 17px; letter-spacing: -0.01em; color: var(--text-primary); transition: opacity 300ms ease;
  }
  .list button:hover { opacity: 0.85; }
  .list .sub { color: var(--text-tertiary); font-size: 13px; letter-spacing: 0; white-space: nowrap; }
  .list .chev { color: var(--text-tertiary); margin-left: 8px; }
  .empty { color: var(--text-tertiary); font-size: 13px; letter-spacing: 0; padding: 16px 0 4px; }

  /* Training */
  .ttl { display: grid; grid-template-columns: 1fr; gap: 8px; align-items: start; margin-top: 20px; }
  .ttl input[type="date"] { justify-self: start; }
  .ttl .title { font-size: 26px; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; background: transparent; padding: 0; border-radius: 12px; resize: none; overflow: hidden; min-height: 32px; }
  .ttl .title:focus { background: var(--field); padding: 8px 12px; }
  .ttl input[type="date"] { width: auto; font-size: 13px; letter-spacing: 0; color: var(--text-tertiary); padding: 8px 12px; }

  .rows { display: flex; flex-direction: column; gap: 16px; margin-top: 24px; }
  .block.ss-1 { --ss: var(--group-1); }
  .block.ss-2 { --ss: var(--group-2); }
  .group-cap { display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; margin: 0 0 8px 2px; font-size: 13px; letter-spacing: 0; color: var(--text-tertiary); }
  .group-cap b { font-weight: 500; letter-spacing: 0.10em; text-transform: uppercase; color: var(--ss); }
  .group { background: var(--card); border: 1.5px solid var(--ss); border-radius: 20px; }
  .labwrap { position: relative; }
  .numpick {
    position: absolute; left: 0; top: calc(100% + 4px); z-index: 4;
    display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; width: max-content; max-width: 276px;
    background: var(--surface); border: 1px solid var(--card-border); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }
  .numpick button {
    appearance: none; border: 0; cursor: pointer; width: 44px; height: 44px; border-radius: 12px;
    background: var(--field); color: var(--text-primary); font-size: 16px; font-weight: 500;
  }
  .numpick button.cur { box-shadow: inset 0 0 0 1.5px var(--ss); }
  .row { padding: 16px; }
  .group .row + .row { border-top: 1px solid var(--card-border); }
  .group .row .top input.label { box-shadow: inset 0 0 0 1.5px var(--ss); }
  .row .top { display: grid; grid-template-columns: 56px 1fr 40px; gap: 8px; align-items: center; }
  body.client .row .top { grid-template-columns: 56px 1fr; }
  .block.done { --ss: var(--done-fill); }
  .card-foot { padding: 4px 16px 16px; display: flex; justify-content: flex-end; }
  .done-btn {
    appearance: none; cursor: pointer; border-radius: 50px; min-height: 40px; padding: 10px 24px;
    font-size: 14px; font-weight: 400; letter-spacing: 0.01em;
    background: transparent; color: var(--text-secondary); border: 1px solid var(--card-border);
    transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease, opacity 300ms ease;
  }
  .done-btn:hover { opacity: 0.85; }
  .block.done .done-btn { background: var(--done-fill); border-color: var(--done-fill); color: var(--done-ink); }
  .block.done .group-cap b { color: var(--done); }
  .row .top input.label { text-align: center; font-weight: 500; padding-left: 8px; padding-right: 8px; }
  .row .top .exwrap { position: relative; }
  .row .top .name { font-weight: 500; resize: none; overflow: hidden; min-height: 44px; line-height: 1.3; }
  .row .x {
    appearance: none; border: 0; background: none; color: var(--text-tertiary); cursor: pointer;
    width: 40px; height: 44px; font-size: 20px; line-height: 1; border-radius: 12px; transition: opacity 300ms ease;
  }
  .row .x:hover { opacity: 0.7; }
  .sugg {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 4;
    background: var(--surface); border: 1px solid var(--card-border); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12); overflow: hidden; padding: 4px 0; margin: 0; list-style: none;
  }
  .sugg button {
    appearance: none; border: 0; background: none; width: 100%; text-align: left; cursor: pointer;
    padding: 12px 16px; font-size: 16px; letter-spacing: -0.01em; color: var(--text-primary);
  }
  .sugg button:hover, .sugg button:focus { background: var(--field); outline: none; }
  .specs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
  .specs label { display: block; font-size: 13px; font-weight: 500; line-height: 1; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text-tertiary); margin: 0 0 8px 2px; }
  .specs input { padding: 12px 8px; text-align: center; }
  .weights { margin-top: 16px; }
  .weights .cap { font-size: 13px; font-weight: 500; line-height: 1; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text-tertiary); margin: 0 0 8px 2px; display: flex; justify-content: space-between; gap: 8px; }
  .weights .cap span:last-child { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--text-tertiary); }
  .weights .boxes { display: flex; gap: 8px; flex-wrap: wrap; }
  .weights input { flex: 1 1 52px; max-width: 80px; text-align: center; padding: 12px 4px; font-weight: 500; }

  .note { margin-top: 12px; }
  .note-toggle {
    appearance: none; border: 0; background: none; padding: 0 2px; width: 100%; text-align: left; cursor: pointer;
    min-height: 32px; font-size: 13px; letter-spacing: 0; color: var(--text-tertiary); transition: opacity 300ms ease;
  }
  .note-toggle.has { color: var(--brand); font-weight: 500; }
  .note-toggle:hover { opacity: 0.7; }
  .note-field { font-style: italic; min-height: 44px; resize: none; overflow: hidden; }
  .add { margin-top: 16px; }
  .foot { margin-top: 40px; border-top: 1px solid var(--card-border); padding-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .confirm { color: var(--text-secondary); font-size: 17px; }

  @media (max-width: 400px) {
    .row .top { grid-template-columns: 52px 1fr 36px; }
    body.client .row .top { grid-template-columns: 52px 1fr; }
    .specs { gap: 4px; }
    .specs label { letter-spacing: 0.06em; font-size: 12px; }
    .specs input { padding-left: 4px; padding-right: 4px; font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn, .back, .list button, .x, input, textarea { transition: none; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <button class="back" id="back" hidden><span>&#8249;</span><span id="backLabel"></span></button>
    <div class="brand" id="brand"><img class="logo-light" src="brand/lockup-black.svg" alt="Fiala Fitness"><img class="logo-dark" src="brand/lockup-white.svg" alt="Fiala Fitness"></div>
    <div id="status"></div>
  </div>
</header>

<main>
  <section id="vLogin" hidden>
    <h1>Sign in</h1>
    <form id="loginForm" class="stack">
      <input id="loginEmail" type="email" placeholder="Email" autocomplete="username" inputmode="email" autocapitalize="none" required>
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="btn" type="submit" id="loginBtn" style="width:100%">Sign in</button>
      <p class="muted" id="loginMsg"></p>
      <button class="btn quiet" type="button" id="createBtn" style="width:100%">First time here? Create the account</button>
      <button class="btn quiet" type="button" id="forgotBtn" style="width:100%">Forgot password?</button>
    </form>
  </section>

  <section id="vRecovery" hidden>
    <h1>New password</h1>
    <form id="recoveryForm" class="stack">
      <input id="recoveryPassword" type="password" placeholder="New password (8+ characters)" autocomplete="new-password" required>
      <button class="btn" type="submit" style="width:100%">Save password</button>
      <p class="muted" id="recoveryMsg"></p>
    </form>
  </section>

  <section id="vWaiting" hidden>
    <h1>Almost there</h1>
    <p id="waitingText" style="max-width:420px"></p>
    <div class="foot"><button class="btn quiet" id="retryBtn" type="button">Try again</button><button class="btn quiet" id="signout3" type="button">Sign out</button></div>
  </section>

  <section id="vClients">
    <h1>Clients</h1>
    <form class="addrow" id="clientForm">
      <input id="clientName" placeholder="New client" autocomplete="off" autocapitalize="words">
      <button class="btn sm" type="submit">Add</button>
    </form>
    <div class="foot" id="localFoot" hidden><span class="muted" id="dataNote">Saved on this device</span><button class="btn quiet" id="backup" type="button">Back up</button><button class="btn quiet" id="restore" type="button">Restore</button><input type="file" id="restoreFile" accept="application/json,.json" hidden><button class="btn quiet" id="signout" type="button" hidden>Sign out</button></div>
    <ul class="list" id="clientList" style="margin-top:16px"></ul>
    <div class="empty" id="clientEmpty" hidden>No clients yet. Add the first one above.</div>
  </section>

  <section id="vClient" hidden>
    <input id="cName" class="pagetitle" placeholder="Client name" autocapitalize="words">
    <div class="trainer-only" id="cEmailWrap" style="margin-top:8px">
      <input id="cEmail" type="email" placeholder="Their sign-in email" autocomplete="off" inputmode="email" autocapitalize="none">
      <p class="muted" style="margin:8px 2px 0">They create their own account with this email and see their trainings.</p>
    </div>
    <h2>Trainings</h2>
    <button class="btn trainer-only" id="newTraining" style="width:100%">+ New training</button>
    <ul class="list" id="trainingList" style="margin-top:12px"></ul>
    <div class="empty" id="trainingEmpty" hidden>No trainings yet.</div>
    <div class="trainer-only">
      <h2>Notes</h2>
      <textarea id="cNotes" placeholder="Injuries, preferences, anything to remember"></textarea>
    </div>
    <div class="foot" id="clientFoot" hidden><span class="muted" id="clientFootNote"></span><button class="btn quiet" id="signout2" type="button">Sign out</button></div>
    <div class="foot trainer-only">
      <button class="btn danger" id="delClient">Delete client</button>
      <span class="confirm" id="delClientConfirm" hidden>Deletes all their trainings too. <button class="btn danger" id="delClientYes">Delete</button> <button class="btn quiet" id="delClientNo">Keep</button></span>
    </div>
  </section>

  <section id="vTraining" hidden>
    <div class="ttl">
      <textarea id="tTitle" class="title" rows="1" placeholder="Training title" autocapitalize="sentences"></textarea>
      <input id="tDate" type="date">
    </div>
    <div class="rows" id="rows"></div>
    <button class="btn quiet add trainer-only" id="addRow">+ Add exercise</button>
    <div class="foot trainer-only">
      <button class="btn quiet" id="copyTraining">Copy training</button>
      <button class="btn danger" id="delTraining">Delete training</button>
      <span class="confirm" id="delTrainingConfirm" hidden><button class="btn danger" id="delTrainingYes">Delete</button> <button class="btn quiet" id="delTrainingNo">Keep</button></span>
    </div>
  </section>
</main>

<script>

  function key(kind, id) { return kind + "/" + id; }
  function markDirty(kind, id) { const k = key(kind, id); dirty.set(k, (dirty.get(k) || 0) + 1); }

  function scheduleSave(kind, id, delay = 500) {
    markDirty(kind, id);
    const k = key(kind, id);
    clearTimeout(timers.get(k));
    timers.set(k, setTimeout(() => flushOne(kind, id), delay));
    setStatus();
  }

  function flushAll() { for (const k of [...timers.keys()]) { const [kind, id] = k.split("/"); clearTimeout(timers.get(k)); flushOne(kind, id); } }

  function flushOne(kind, id) {
    const k = key(kind, id);
    timers.delete(k);
    localBackend.save();
    const map = kind === "clients" ? clients : trainings;
    const doc = map.get(id);
    const version = dirty.get(k) || 0;
    const data = doc ? JSON.parse(JSON.stringify(doc)) : null;
    const prev = chains.get(k) || Promise.resolve();
    inflight++; setStatus();
    const run = prev.then(async () => {
      if (!backend) return;
      let attempt = 0;
      for (;;) {
        try {
          if (data) await backend.set(kind, id, data); else await backend.del(kind, id);
          failed = false;
          if (dirty.get(k) === version) dirty.delete(k);
          return;
        } catch (e) {
          attempt++;
          if (e && e.fatal) { failed = true; return; }
          if (attempt > 3) { failed = true; return; }
          await new Promise((r) => setTimeout(r, 700 * attempt + Math.random() * 400));

      }
    }).finally(() => { inflight--; setStatus(); });
    chains.set(k, run.catch(() => {}));
    return run;
  }

    async set(kind, id, data) {
      const k = key(kind, id);

      if (kind === "trainings") row.client_id = data.clientId;
      for (let attempt = 0; attempt < 3; attempt++) {
        const seen = seenAt.get(k);
        let res;

        else res = await sb.from(TABLE[kind]).upsert(row).select("updated_at");

          if (res.error.code === "23505") { res.error.fatal = true; $("status").textContent = "That email is already on another client"; }
          throw res.error;
        }
        if (res.data && res.data.length) { seenAt.set(k, res.data[0].updated_at); localBackend.save(); return; }
        // someone else (a client logging weights) saved first: take their weights, keep everything else, retry
        const fresh = await sb.from(TABLE[kind]).select("data,updated_at").eq("id", id).maybeSingle();
        if (fresh.error) throw fresh.error;
        if (!fresh.data) { seenAt.delete(k); continue; }
        seenAt.set(k, fresh.data.updated_at);
        if (kind === "trainings") {
          const touched = trainerTouched.get(id) || new Set();
          const live = trainings.get(id);
          for (const sr of fresh.data.data.rows || []) {
            if (touched.has(sr.id)) continue;
            for (const target of [data, live]) { const lr = target && (target.rows || []).find((x) => x.id === sr.id); if (lr) { lr.weights = sr.weights || []; lr.done = !!sr.done; } }
          }
        }
      }
      throw new Error("save conflict");
    },
    async del(kind, id) {
      const { error } = await sb.from(TABLE[kind]).delete().eq("id", id);
      if (error) throw error;
      localBackend.save();
    },
  };

      for (let i = 0; i < ids.length; i++) {

  function renderTraining(t) {

    rowsEl.replaceChildren();
    const groups = [];
    t.rows.forEach((r, i) => {

  function groupKey(label, index) {
    const s = String(label || "").trim().toLowerCase();
    const m = s.match(/^(\d+)/);
    return m ? m[1] : (s || "row-" + index);
  }
  // Numbering rule: one exercise on a number is plain (2); two or more share letters (1a, 1b …).
  // The letter you type is a position: 1a moves that exercise to the top of its card,
  // 1c to third place; the others shift to fill.
  let lastEditedId = null;
  function normalizeLabels(t) {
    const groups = new Map();
    t.rows.forEach((r, i) => { const k = groupKey(r.label, i); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
    let changed = false;
    for (const [k, members] of groups) {
      if (!/^\d+$/.test(k)) continue;
      if (members.length === 1) {
        if (members[0].label !== k) { members[0].label = k; changed = true; }
        continue;
      }
      const letter = (r) => ((String(r.label || "").trim().match(/^\d+\s*([a-z]*)/i) || [])[1] || "").toLowerCase();
      const edited = members.find((r) => r.id === lastEditedId) || null;
      const ordered = members.filter((r) => r !== edited)
        .sort((a, b) => { const la = letter(a) || "~", lb = letter(b) || "~"; return la < lb ? -1 : la > lb ? 1 : 0; });
      if (edited) {
        const L = letter(edited);
        const at = L ? Math.max(0, Math.min(L.charCodeAt(0) - 97, ordered.length)) : ordered.length;
        ordered.splice(at, 0, edited);
      }
      ordered.forEach((r, j) => { const want = k + String.fromCharCode(97 + Math.min(j, 25)); if (r.label !== want) { r.label = want; changed = true; } });
    }
    lastEditedId = null;
    return changed;
  }

  function rowEl(t, r) {
    const el = document.createElement("div"); el.className = "row"; el.dataset.id = r.id;
    el.innerHTML = `
      <div class="top">
        <div class="labwrap"><input class="label tab" placeholder="#" autocomplete="off" autocapitalize="none" aria-label="Number"><div class="numpick" hidden></div></div>
        <div class="exwrap"><textarea class="name" rows="1" placeholder="Exercise" autocomplete="off" autocapitalize="sentences" aria-label="Exercise"></textarea><ul class="sugg" hidden></ul></div>
        <button class="x" type="button" aria-label="Remove exercise">\u00d7</button>
      </div>
      <div class="specs">
        <div><label>Sets</label><input class="sets tab" inputmode="numeric" pattern="[0-9]*" placeholder="3"></div>
        <div><label>Reps</label><input class="reps tab" placeholder="10"></div>
        <div><label>Tempo</label><input class="tempo tab" placeholder="1010" autocapitalize="characters"></div>
        <div><label>Rest</label><input class="rest tab" placeholder="60 s"></div>
      </div>
      <div class="weights"><div class="cap"><span>Weights &middot; lb</span><span class="last"></span></div><div class="boxes"></div></div>
      <div class="note"><button type="button" class="note-toggle"></button><textarea class="note-field" rows="1" placeholder="Note" hidden></textarea></div>`;
    const q = (s) => el.querySelector(s);
    const growName = () => { const n = q(".name"); n.style.height = "auto"; n.style.height = Math.max(44, n.scrollHeight) + "px"; };
    q(".label").value = r.label || ""; q(".name").value = r.name || "";
    requestAnimationFrame(growName);
    q(".name").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); e.currentTarget.blur(); } });
    q(".sets").value = r.sets || ""; q(".reps").value = r.reps || ""; q(".tempo").value = r.tempo || "";
    q(".rest").value = r.rest || "";

    const save = () => scheduleSave("trainings", t.id);
    if (clientMode) { for (const s of [".label", ".name", ".sets", ".reps", ".tempo", ".rest"]) q(s).readOnly = true; }
    const bind = (sel, field, transform) => { if (clientMode) return; q(sel).addEventListener("input", (e) => { r[field] = transform ? transform(e.target.value) : e.target.value; save(); }); };
    if (!clientMode) q(".label").addEventListener("input", (e) => { r.label = e.target.value; lastEditedId = r.id; save(); });
    bind(".reps", "reps"); bind(".tempo", "tempo"); bind(".rest", "rest");
    const numpick = q(".numpick");
    function showNumbers() {
      let max = 0;
      for (const x of t.rows) { const m = String(x.label || "").match(/^(\d+)/); if (m) max = Math.max(max, Number(m[1])); }
      const cur = (String(r.label || "").match(/^(\d+)/) || [])[1];
      numpick.replaceChildren(...Array.from({ length: Math.max(max + 1, 1) }, (_, i) => {
        const n = String(i + 1); const b = document.createElement("button"); b.type = "button"; b.textContent = n;
        if (n === cur) b.classList.add("cur");
        b.addEventListener("mousedown", (ev) => ev.preventDefault());
        b.addEventListener("click", () => { r.label = n; lastEditedId = r.id; q(".label").value = n; numpick.hidden = true; save(); renderedTraining = null; render(); });
        return b;
      }));
      numpick.hidden = false;
    }
    if (!clientMode) {
      q(".label").addEventListener("focus", showNumbers);
      q(".label").addEventListener("blur", () => { numpick.hidden = true; renderedTraining = null; render(); });
      q(".sets").addEventListener("input", (e) => { const v = e.target.value.replace(/\D/g, "").slice(0, 2); e.target.value = v; r.sets = v === "" ? 0 : clamp(parseInt(v, 10), 0, 20); renderWeights(); save(); });
      q(".name").addEventListener("input", (e) => { r.name = e.target.value.replace(/\n/g, " "); growName(); save(); suggest(e.target.value); renderWeights(); });
      q(".name").addEventListener("blur", () => setTimeout(() => { q(".sugg").hidden = true; }, 120));
      q(".name").addEventListener("focus", (e) => suggest(e.target.value));
      q(".x").addEventListener("click", () => { t.rows = t.rows.filter((x) => x.id !== r.id); save(); renderedTraining = null; render(); });
    }

    const noteToggle = q(".note-toggle"), noteField = q(".note-field");
    const growNote = () => { noteField.style.height = "auto"; noteField.style.height = noteField.scrollHeight + "px"; };
    const showNote = () => { const v = (r.note || "").trim(); noteToggle.textContent = v ? "Read note" : "Add note"; noteToggle.classList.toggle("has", !!v); };
    noteToggle.addEventListener("click", () => { noteToggle.hidden = true; noteField.hidden = false; noteField.value = r.note || ""; growNote(); noteField.focus(); });
    noteField.addEventListener("input", (e) => { r.note = e.target.value; growNote(); save(); });
    noteField.addEventListener("blur", () => { noteField.hidden = true; noteToggle.hidden = false; showNote(); });
    showNote();

    function suggest(v) {
      const ul = q(".sugg"); const s = norm(v);
      if (s.length < 2) { ul.hidden = true; return; }
      const starts = [], contains = [];
      for (const n of NAMES) { const ln = n.toLowerCase(); if (ln === s) continue; if (ln.startsWith(s)) starts.push(n); else if (ln.includes(s)) contains.push(n); if (starts.length >= 6) break; }
      const hits = [...starts, ...contains].slice(0, 6);
      ul.replaceChildren(...hits.map((n) => { const li = document.createElement("li"); const b = document.createElement("button"); b.type = "button"; b.textContent = n; b.addEventListener("mousedown", (ev) => ev.preventDefault()); b.addEventListener("click", () => { r.name = n; q(".name").value = n; growName(); ul.hidden = true; save(); renderWeights(); }); li.appendChild(b); return li; }));
      ul.hidden = hits.length === 0;
    }

    function renderWeights() {
      const n = clamp(parseInt(r.sets, 10) || 0, 0, 20);
      const boxes = q(".boxes"); const last = lastWeights(t, r);
      q(".last").textContent = last ? "last time \u00b7 " + fmtDate(last.date) : "";
      r.weights = (r.weights || []).slice(0, n); while (r.weights.length < n) r.weights.push("");
      boxes.replaceChildren(...Array.from({ length: n }, (_, i) => {
        const inp = document.createElement("input"); inp.className = "tab"; inp.inputMode = "decimal"; inp.setAttribute("aria-label", "Set " + (i + 1) + " weight");
        inp.value = r.weights[i] || ""; const hint = !!(last && last.weights[i]); inp.placeholder = hint ? last.weights[i] : "\u2013"; inp.classList.toggle("hint", hint);
        inp.addEventListener("input", (e) => {
          r.weights[i] = e.target.value;
          const track = clientMode ? pendingWeightRows : trainerTouched;
          if (!track.has(t.id)) track.set(t.id, new Set());
          track.get(t.id).add(r.id);
          save();
        });
        inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); const nx = boxes.children[i + 1]; if (nx) nx.focus(); else inp.blur(); } });
        return inp;
      }));
      el.querySelector(".weights").hidden = n === 0;
    }
    renderWeights();
    return el;
  }

  // ---------- events ----------
  $("clientForm").addEventListener("submit", (e) => { e.preventDefault(); const n = $("clientName").value.trim(); if (!n) return; $("clientName").value = ""; addClient(n); });
  $("cName").addEventListener("input", (e) => { const c = clients.get(view.id); if (!c) return; c.name = e.target.value; scheduleSave("clients", c.id); });
  $("cNotes").addEventListener("input", (e) => { const c = clients.get(view.id); if (!c) return; c.notes = e.target.value; scheduleSave("clients", c.id); });
  $("cEmail").addEventListener("input", (e) => { const c = clients.get(view.id); if (!c) return; c.email = e.target.value.trim().toLowerCase(); scheduleSave("clients", c.id); });
  $("newTraining").addEventListener("click", () => addTraining(view.id));
  $("delClient").addEventListener("click", () => { $("delClient").hidden = true; $("delClientConfirm").hidden = false; });
  $("delClientNo").addEventListener("click", () => { $("delClientConfirm").hidden = true; $("delClient").hidden = false; });
  $("delClientYes").addEventListener("click", () => deleteClient(view.id));

  $("tTitle").addEventListener("input", (e) => { const t = trainings.get(view.id); if (!t) return; t.title = e.target.value.replace(/\n/g, " "); e.target.style.height = "auto"; e.target.style.height = Math.max(32, e.target.scrollHeight) + "px"; scheduleSave("trainings", t.id); });
  $("tTitle").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); e.currentTarget.blur(); } });
  $("tDate").addEventListener("change", (e) => { const t = trainings.get(view.id); if (!t) return; t.date = e.target.value || today(); scheduleSave("trainings", t.id); renderedTraining = null; render(); });
  $("addRow").addEventListener("click", () => {
    const t = trainings.get(view.id); if (!t) return;
    const r = newRow(nextLabel(t)); t.rows.push(r); scheduleSave("trainings", t.id);
    renderedTraining = null; render();
    const el = document.querySelector('.row[data-id="' + r.id + '"]'); if (el) el.querySelector(".name").focus();
  });
  $("copyTraining").addEventListener("click", () => { const t = trainings.get(view.id); if (t) addTraining(t.clientId, t); });
  $("delTraining").addEventListener("click", () => { $("delTraining").hidden = true; $("delTrainingConfirm").hidden = false; });
  $("delTrainingNo").addEventListener("click", () => { $("delTrainingConfirm").hidden = true; $("delTraining").hidden = false; });
  $("delTrainingYes").addEventListener("click", () => deleteTraining(view.id));

  window.addEventListener("pagehide", flushAll);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushAll(); });

  $("backup").addEventListener("click", () => {
    const data = { app: "fiala-trainings", exported: now(), clients: Object.fromEntries(clients), trainings: Object.fromEntries(trainings) };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "fiala-trainings-" + today() + ".json";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  $("restore").addEventListener("click", () => $("restoreFile").click());
  $("restoreFile").addEventListener("change", async (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!d || d.app !== "fiala-trainings") throw new Error("not a backup");
      for (const c of Object.values(d.clients || {})) { clients.set(c.id, c); scheduleSave("clients", c.id, 0); }
      for (const t of Object.values(d.trainings || {})) { trainings.set(t.id, t); scheduleSave("trainings", t.id, 0); }
      render();
    } catch { $("status").textContent = "That file is not a Fiala backup"; }
    e.target.value = "";
  });

  // ---------- boot ----------
  async function boot() {
    const saved = lsGet("fiala.trainings.view"); if (saved && saved.name) view = saved;
    localBackend.load();                       // instant start from the device copy
    if (window.supabase && window.supabase.createClient) {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "implicit" } });
      $("status").textContent = "Loading\u2026";
      const fromRecoveryLink = /type=recovery/.test(location.hash);
      sb.auth.onAuthStateChange((event) => {
        if (event === "PASSWORD_RECOVERY") { recovering = true; showRecovery(); }
        if (event === "SIGNED_OUT" && signedIn) showLogin("Signed out. Sign in again to keep syncing.");
      });
      const { data } = await sb.auth.getSession();
      if (location.hash && /access_token|error/.test(location.hash)) history.replaceState(null, "", location.pathname);
      if (fromRecoveryLink && data && data.session) { recovering = true; showRecovery(); return; }
      if (data && data.session) { await enterCloud(data.session); }
      else { showLogin(""); }
      return;
    }
    // no library (blocked network): work from the device copy
    backend = localBackend; $("localFoot").hidden = false; render(); setStatus();
  }
  if (!(window.supabase && window.supabase.createClient)) render();
  boot();
})();
</script>

</body>
